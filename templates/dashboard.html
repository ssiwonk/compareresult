<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>슬라이드 비교 허브 (Slide Comparison Hub)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body class="theme-light">
  <!-- Dashboard Header -->
  <header class="hub-header">
    <div class="header-container">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
        </div>
        <div class="brand-text">
          <h1>슬라이드 비교 허브</h1>
          <span class="hub-subtitle">Slide Comparison Dashboard</span>
        </div>
      </div>

      <div class="header-actions">
        <div class="search-wrap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="projectSearchInput" placeholder="프로젝트 또는 파일명 검색...">
        </div>
        <button id="btnToggleTheme" class="icon-btn" title="다크/라이트 모드">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Hub Content -->
  <main class="hub-main">
    <div class="hub-container">
      <!-- Hub Intro / Stats Bar -->
      <section class="hub-summary-bar">
        <div class="summary-info">
          <h2>비교 프로젝트 목록</h2>
          <p>등록된 <span id="totalProjectsCount">0</span>개의 프로젝트 비교 뷰어를 탐색할 수 있습니다.</p>
        </div>
        <div class="guide-box">
          <span class="guide-badge">새 프로젝트 추가 방법</span>
          <code>input/</code> 폴더에 <code>2주차</code> 등 새 폴더를 만들고 PDF/PPTX 파일을 넣은 후 <code>python build.py</code>를 실행하세요!
        </div>
      </section>

      <!-- Projects Grid -->
      <div class="projects-grid" id="projectsGrid">
        <!-- Injected via JS -->
      </div>
    </div>
  </main>

  <footer class="hub-footer">
    <div class="hub-container">
      <p>Slide Comparison Viewer Hub &copy; 2026. Automated Sequence Alignment & High-Res Slide Viewer.</p>
    </div>
  </footer>

  <script src="projects.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
