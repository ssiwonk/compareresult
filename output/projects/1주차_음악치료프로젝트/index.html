<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>슬라이드 다단 비교 뷰어 (Slide Comparison Viewer)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-light">
  <!-- Top Navigation Bar -->
  <header class="app-header">
    <div class="header-left">
      <a href="../../index.html" class="home-btn" title="대시보드 허브 홈으로 돌아가기">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>허브 홈</span>
      </a>
      <div class="divider-v"></div>
      <button id="btnToggleSidebar" class="icon-btn" title="목차 사이드바 토글">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="brand">
        <span class="brand-badge">COMPARE</span>
        <h1 class="brand-title" id="projectTitleHeader">슬라이드 비교 뷰어</h1>
      </div>
    </div>

    <div class="header-center">
      <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" placeholder="슬라이드 제목 또는 내용 검색...">
        <button id="btnClearSearch" class="clear-btn" style="display:none;">&times;</button>
      </div>
    </div>

    <div class="header-right">
      <!-- Column Visibility Toggles -->
      <div class="column-toggles" id="columnToggles">
        <!-- Dynamically injected via JS -->
      </div>
      
      <div class="divider-v"></div>

      <!-- Theme & Layout Controls -->
      <div class="view-controls">
        <button id="btnToggleDensity" class="control-btn" title="여백 조절 (컴팩트/기본)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18M3 15h18"/></svg>
        </button>
        <button id="btnToggleTheme" class="control-btn" title="다크/라이트 모드">
          <svg id="themeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-layout">
    <!-- Left Navigation Sidebar -->
    <aside class="app-sidebar" id="appSidebar">
      <div class="sidebar-header">
        <h3>슬라이드 목차</h3>
        <span class="slide-count-badge" id="sidebarSlideCount">0</span>
      </div>
      <div class="sidebar-list" id="sidebarList">
        <!-- Injected via JS -->
      </div>
    </aside>

    <!-- Main Comparison Grid Area -->
    <main class="main-content" id="mainContent">
      <!-- Sticky Column Headers -->
      <div class="comparison-header-row" id="comparisonHeaderRow">
        <!-- Injected via JS -->
      </div>

      <!-- Comparison Rows Container -->
      <div class="comparison-grid-container" id="comparisonGrid">
        <!-- Injected via JS -->
      </div>
    </main>
  </div>

  <!-- Lightbox Modal for Zooming Slide -->
  <div class="modal-overlay" id="lightboxModal" style="display:none;">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-info">
          <span class="modal-badge" id="modalBadge">File 1 - Slide 1</span>
          <span class="modal-title" id="modalTitle">Slide Title</span>
        </div>
        <div class="modal-actions">
          <button id="btnZoomOut" class="icon-btn" title="축소"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
          <span id="zoomLevelText" class="zoom-level">100%</span>
          <button id="btnZoomIn" class="icon-btn" title="확대"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg></button>
          <button id="btnResetZoom" class="icon-btn" title="원본 크기">1:1</button>
          <div class="divider-v"></div>
          <button id="btnCloseModal" class="icon-btn close-btn" title="닫기 (ESC)">&times;</button>
        </div>
      </div>
      
      <div class="modal-body" id="modalBody">
        <img id="modalImage" src="" alt="Zoomed Slide">
      </div>

      <div class="modal-footer">
        <button id="btnPrevSlide" class="nav-btn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg> 이전</button>
        <span class="modal-counter" id="modalCounter">1 / 25</span>
        <button id="btnNextSlide" class="nav-btn">다음 <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
      </div>
    </div>
  </div>

  <!-- Slide Data -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
